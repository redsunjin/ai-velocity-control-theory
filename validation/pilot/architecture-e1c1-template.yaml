# AVCT E1/C1 pilot architecture template
#
# This file defines the execution/control envelope for the first REAL agent
# instrumentation check. Fields marked MUST_PIN_BEFORE_RUN prevent a run from
# being treated as empirical data until the exact runner/model/toolchain is
# recorded.

architecture_id: e1c1-pilot-v0.1
status: template-not-frozen
experiment_condition: E1/C1

execution:
  agent_count_target: 1
  max_concurrency: 1
  task_scope: isolated-repository-branch
  production_access: false
  external_write_access: false
  network_access: MUST_PIN_BEFORE_RUN
  runner: MUST_PIN_BEFORE_RUN
  runner_version: MUST_PIN_BEFORE_RUN
  model_provider: MUST_PIN_BEFORE_RUN
  model_id: MUST_PIN_BEFORE_RUN
  model_version_or_snapshot: MUST_PIN_BEFORE_RUN
  reasoning_or_effort_setting: MUST_PIN_BEFORE_RUN
  toolset_manifest: MUST_PIN_BEFORE_RUN
  prompt_or_instruction_version: MUST_PIN_BEFORE_RUN

control:
  architecture: full-gate
  rule: >-
    Every branch-local write or command that can change the task workspace is
    recorded as control-requiring for the pilot. Read/search actions may be
    logged but do not require approval unless the runner itself requires it.
  low_risk_route: human
  medium_risk_route: human
  high_risk_route: human
  automated_verifier: false
  sampled_human_review: false
  human_gate_required_for:
    - tracked-file-write
    - test-or-command-execution-with-side-effects
    - commit
  reviewer_count: 1
  reviewer_identity_storage: hashed-role-only
  reviewer_protocol: validation/pilot/ground-truth-and-review-protocol.md

reversibility:
  supported: true
  mechanism:
    - isolated-git-branch
    - pre-task-clean-baseline
    - recorded-before-after-diff
    - branch-reset-or-revert
  external_irreversible_actions: prohibited

telemetry:
  schema: validation/telemetry-schema.md
  format: jsonl
  raw_prompt_storage: prohibited
  raw_response_storage: prohibited
  secret_storage: prohibited
  pii_storage: prohibited
  output_storage: hash-or-repository-reference
  required_linkage:
    - execution-action
    - control-action
    - outcome-action

pilot:
  planned_task_count: 5
  task_set: validation/pilot/task-set-v0.1.json
  empirical_status: not-run
  minimum_traceability: 0.95

freeze_rule: >-
  Replace every MUST_PIN_BEFORE_RUN value, commit the exact manifest, and do not
  change it during the five-task pilot. If any field changes, increment the
  architecture_id and restart the affected task set.
